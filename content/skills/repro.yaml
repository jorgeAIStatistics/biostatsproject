    name: Git fundamentals
    description: Repositories, commits, staging, diffs, history, .gitignore.
    weight: 2
    tracks: [computing, programmer, analytics]
  - id: repro.branching
    name: Branches and pull requests
    description: Feature branches, merging, pull requests, resolving conflicts, tags/releases.
