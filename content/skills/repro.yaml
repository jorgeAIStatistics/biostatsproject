  - id: repro.code-review
    name: Reviewing changes
    description: Reading diffs, giving actionable review comments, catching specification drift.
    weight: 2
    tracks: [computing, programmer]
  - id: repro.testing
    name: Testing principles
    description: Unit tests, regression tests, testing data functions; pytest, testthat and SAS validation patterns.
    weight: 2
    tracks: [computing, analytics, programmer]
  - id: repro.project-structure
    name: Reproducible project structure
    description: READMEs, folder conventions, relative paths, environment capture, run-all scripts.
    weight: 2
    tracks: [computing, analytics, programmer]
  - id: repro.documentation
    name: Documentation and audit trail
    description: Change logs, program headers, traceable manual steps (or eliminating them).
