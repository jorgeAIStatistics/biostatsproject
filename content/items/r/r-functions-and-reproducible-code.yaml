    minutes: 20
    prompt: |
      Write `derive_worst_grade(adlb, adsl, pop = "SAFFL")` returning one row per population subject and
      laboratory parameter, with columns `USUBJID`, `PARAMCD`, `n_rec`, `n_grd` and `WTOXGR`.

      - the population comes from **ADSL**, using the flag named by `pop`
      - `n_rec` counts on-treatment records (`ONTRTFL == "Y"`); `n_grd` counts those with a non-missing
        `ATOXGR`; both are `0` where the subject has no such records
      - `WTOXGR` is the maximum `ATOXGR`, or `NA_integer_` where nothing is gradeable — **never `-Inf`**
      - assert the input has no duplicated `USUBJID`, that the output has exactly
        `subjects × parameters` rows, and that no `WTOXGR` is infinite
    starter: |
      library(dplyr)

      derive_worst_grade <- function(adlb, adsl, pop = "SAFFL") {
        stopifnot(___)

        pop_ids <- ___
        params  <- sort(unique(adlb$PARAMCD))

        obs <- adlb |>
          filter(ONTRTFL == "Y", USUBJID %in% pop_ids) |>
          summarise(n_rec  = ___,
                    n_grd  = ___,
                    WTOXGR = ___,
                    .by = c(USUBJID, PARAMCD))

        out <- expand.grid(___) |>
          left_join(obs, by = c("USUBJID", "PARAMCD")) |>
          mutate(___)

        stopifnot(___)
        out
      }
    reference: |
      library(dplyr)

      derive_worst_grade <- function(adlb, adsl, pop = "SAFFL") {
        stopifnot(
          pop %in% names(adsl),
          all(c("USUBJID", "PARAMCD", "ATOXGR", "ONTRTFL") %in% names(adlb)),
          !any(duplicated(adsl$USUBJID))
        )

        pop_ids <- adsl$USUBJID[adsl[[pop]] == "Y"]
        params  <- sort(unique(adlb$PARAMCD))

        obs <- adlb |>
          filter(ONTRTFL == "Y", USUBJID %in% pop_ids) |>
          summarise(n_rec  = n(),
                    n_grd  = sum(!is.na(ATOXGR)),
                    WTOXGR = if (any(!is.na(ATOXGR))) max(ATOXGR, na.rm = TRUE)
                             else NA_integer_,
                    .by = c(USUBJID, PARAMCD))

        out <- expand.grid(USUBJID = pop_ids, PARAMCD = params,
                           stringsAsFactors = FALSE) |>
          left_join(obs, by = c("USUBJID", "PARAMCD")) |>
          mutate(n_rec = coalesce(n_rec, 0L), n_grd = coalesce(n_grd, 0L))

        stopifnot(
          nrow(out) == length(pop_ids) * length(params),
          !any(is.infinite(out$WTOXGR)),
          all(out$WTOXGR[!is.na(out$WTOXGR)] %in% 0:4)
        )
        out
      }
    hints:
      - "`adsl[[pop]]` indexes by a column name held in a variable; that is why `pop` is a string rather than a bare name here."
      - "`if (any(!is.na(ATOXGR))) max(ATOXGR, na.rm = TRUE) else NA_integer_` is the guard that prevents -Inf."
      - "`expand.grid(..., stringsAsFactors = FALSE)` — the default turns the ids into factors, which then join badly."
      - "`coalesce(n_rec, 0L)` after the left join: unmatched rows have NA counts, and zero is the honest value."
    checks:
      - pattern: "adsl\\[\\[\\s*pop\\s*\\]\\]"
        message: "Takes the population from ADSL using the supplied flag name"
      - pattern: "expand\\.grid\\s*\\("
        message: "Builds the complete subject-by-parameter frame"
      - pattern: "stringsAsFactors\\s*=\\s*FALSE"
        message: "Keeps the identifiers as character so the join works"
      - pattern: "left_join\\s*\\("
        message: "Joins the observations onto the grid rather than the reverse"
      - pattern: "NA_integer_"
        message: "Uses a typed missing value rather than a bare NA"
      - pattern: "is\\.infinite"
        message: "Asserts that no -Inf survived the aggregation"
      - pattern: "duplicated\\s*\\(\\s*adsl\\$USUBJID\\s*\\)"
        message: "Checks the input for a duplicated subject key"
      - pattern: "coalesce\\s*\\("
        message: "Replaces the unmatched NA counts with zero"
      - pattern: "nrow\\s*\\(\\s*out\\s*\\)\\s*==\\s*length\\s*\\(\\s*pop_ids\\s*\\)\\s*\\*\\s*length\\s*\\(\\s*params\\s*\\)"
        message: "Asserts the expected row count"
    expectedOutput: |
      ```text
      > wg <- derive_worst_grade(adlb, adsl)
      > nrow(wg)
      [1] 2912

      > summarise(wg, subjects = n(), no_record = sum(n_rec == 0),
      +               record_no_grade = sum(n_rec > 0 & n_grd == 0),
      +               graded = sum(n_grd > 0), .by = PARAMCD)
        PARAMCD subjects no_record record_no_grade graded
      1     ALT      416        10               0    406
      2     AST      416        10               0    406
      3    BILI      416        10               0    406
      4   CREAT      416        10             406      0
      5     HGB      416         0               0    416
      6    NEUT      416         0               0    416
      7    PLAT      416         0               0    416

      > table(wg$WTOXGR, useNA = "ifany")
         0    1    2    3    4 <NA>
      1754  443  119   86   64  446
      ```
    solution: |
      **2,912 rows = 416 safety subjects × 7 parameters**, and the 446 missing grades split into two
      situations that a single `NA` column would have merged:

      | | Rows | Meaning |
      |---|---:|---|
      | `n_rec == 0` | **40** | No post-baseline record — 10 subjects × 4 chemistry parameters |
      | `n_rec > 0, n_grd == 0` | **406** | Records exist; creatinine is not CTCAE-graded in this study |

      Carrying `n_rec` and `n_grd` out alongside the grade is what lets a reader tell **missing data** from
      **not applicable** without rerunning anything. They belong in different footnotes and they support
      different conclusions.

      **What each defensive element buys:**

      | Element | Failure it prevents |
      |---|---|
      | `adsl[[pop]]` | A denominator of 406 instead of 416 |
      | `expand.grid()` + `left_join()` | Forty combinations silently absent |
      | the `if (any(!is.na(...)))` guard | 406 values of `-Inf` masquerading as grades |
      | `NA_integer_` | A column that silently becomes logical or double |
      | `stringsAsFactors = FALSE` | Factor identifiers that join badly |
      | `coalesce(n_rec, 0L)` | `NA` counts that break a later `sum()` |
      | the three closing assertions | All of the above, if the code is later edited |

      **The naive one-liner** — `summarise(WTOXGR = max(ATOXGR, na.rm = TRUE), .by = c(USUBJID, PARAMCD))`
      on the filtered data — returns 2,872 rows with 406 `-Inf` values and warns about the second defect
      only. The one it does not warn about is the one that reaches the CSR.
    explanation:
      objective: "Write a derivation whose assumptions are enforced rather than assumed."
      given: "A long BDS laboratory dataset, a subject-level dataset with population flags, and a specification for the output grain."
      relevant: "The population source, the completeness of the grid, and the behaviour of max() on an all-missing group."
      method: "Check inputs, build the frame from the population, join observations onto it, assert the result."
      numbers: "2,912 rows; 40 with no record; 406 with records but no derivable grade; grade distribution 1754/443/119/86/64."
      assumptions: "All seven parameters are in scope for every population subject, which the specification decides rather than the data."
      computation: "WTOXGR = if (any(!is.na(ATOXGR))) max(ATOXGR, na.rm = TRUE) else NA_integer_."
      interpretation: "Two distinct reasons for a missing grade, kept distinguishable in the output."
      changes: "Summarising only observed records gives 2,872 rows and a chemistry denominator of 406."
      interviewer: "That you separate 'no record' from 'not gradeable' and can say why they belong in different footnotes."

  - id: r.fun.silent-denominator
    format: hotspot
    language: r
    modes: [debug, qc]
    difficulty: advanced
    skills: [r.functions, tlf.denominators, qc.discrepancy]
    lesson: r-functions-and-reproducible-code
    title: The derivation that lost ten subjects
    minutes: 12
    prompt: |
      This produces a worst-grade dataset for the laboratory shift tables. It runs; the only console
      output is a warning about `max()`.

      The chemistry section of the resulting shift table has a denominator of **406**. ADSL has **416**
      subjects with `SAFFL == "Y"`.

      Click the line that loses the ten subjects.
    code: |
      library(dplyr)

      worst <- adlb |>
        filter(ONTRTFL == "Y") |>
        summarise(
          WTOXGR = max(ATOXGR, na.rm = TRUE),
          .by = c(USUBJID, PARAMCD)
        )

      shift <- worst |>
        left_join(select(adsl, USUBJID, TRTA), by = "USUBJID") |>
        count(TRTA, PARAMCD, WTOXGR)
    answerLines: [3]
    lineNotes:
      - line: 3
        note: "The pipeline starts from `adlb`, so the set of subjects in the output is whoever has laboratory records — not the safety population. Ten subjects have no post-baseline chemistry at all, so they produce no rows for ALT, AST, BILI or CREAT and the chemistry denominator becomes 406. The population must come from ADSL: build `expand.grid(USUBJID = pop_ids, PARAMCD = params)` first and left-join the observations onto it."
      - line: 4
        note: "Restricting to on-treatment records is correct and is what the specification asks for. It is not what removes the subjects — they have no post-baseline chemistry records at all, flagged or otherwise."
      - line: 6
        note: "`max(ATOXGR, na.rm = TRUE)` is a genuine second defect — it returns -Inf for the 406 creatinine groups where every grade is missing. But it produces a warning, and it is not what changed the denominator."
      - line: 11
        note: "The left join brings the treatment arm across correctly. A left join from `worst` keeps whatever `worst` contained, so it preserves the loss rather than causing it."
    fixed: |
      library(dplyr)

      pop_ids <- adsl$USUBJID[adsl$SAFFL == "Y"]
      params  <- sort(unique(adlb$PARAMCD))

      obs <- adlb |>
        filter(ONTRTFL == "Y", USUBJID %in% pop_ids) |>
        summarise(
          n_grd  = sum(!is.na(ATOXGR)),
          WTOXGR = if (any(!is.na(ATOXGR))) max(ATOXGR, na.rm = TRUE)
                   else NA_integer_,
          .by = c(USUBJID, PARAMCD)
        )

      worst <- expand.grid(USUBJID = pop_ids, PARAMCD = params,
                           stringsAsFactors = FALSE) |>
        left_join(obs, by = c("USUBJID", "PARAMCD")) |>
        mutate(n_grd = coalesce(n_grd, 0L))

      stopifnot(nrow(worst) == length(pop_ids) * length(params),
                !any(is.infinite(worst$WTOXGR)))
    hints:
      - "416 - 406 = 10. What would have to be true for a subject to be absent from the output entirely?"
      - "Which dataset does this pipeline start from, and what does that make the set of subjects in the result?"
      - "A summarise can only produce a row for a group that has at least one record."
    solution: |
      **Line 3.** The pipeline starts from `adlb`, so the subjects in the output are whoever has
      laboratory records — not the safety population.

      `summarise()` produces one row per group **that exists in the data**. Ten subjects have no
      post-baseline chemistry records at all, so they form no ALT, AST, BILI or CREAT groups and
      contribute nothing. $10 \times 4 = 40$ rows are simply absent, and the chemistry denominator becomes
      406 rather than 416.

      **The population is a property of the study, recorded in ADSL.** The analysis dataset records who
      had measurements, which is a different question and not the denominator.

      ```r
      pop_ids <- adsl$USUBJID[adsl$SAFFL == "Y"]

      expand.grid(USUBJID = pop_ids, PARAMCD = params, stringsAsFactors = FALSE) |>
        left_join(obs, by = c("USUBJID", "PARAMCD"))

      stopifnot(nrow(worst) == length(pop_ids) * length(params))
      ```

      **Line 6 is a second, independent defect** — `max()` over the 406 all-missing creatinine groups
      returns `-Inf` — and it is worth noticing which of the two gets found.

      | Defect | Signal | Consequence |
      |---|---|---|
      | `max()` on an empty group | **Warns**, 406 times | `-Inf` in a grade column, visible in the output |
      | Population taken from ADLB | **Silent** | Every chemistry percentage overstated by ~2.5% relative |

      The loud one costs an afternoon. The quiet one reaches the clinical study report, because the table
      is internally consistent and nothing in it says the denominator is wrong.

      **The check that catches it outside the code:** denominators in every table must match the "N =" in
      the column headers, which must match the disposition table, which must match ADSL.
    explanation:
      objective: "Trace an understated denominator to the dataset a pipeline started from."
      given: "A shift-table denominator of 406 against a safety population of 416, and a max() warning."
      relevant: "That summarise() cannot create a group that has no records, and that the pipeline begins at ADLB."
      irrelevant: "The left join and the ONTRTFL filter, both of which are correct."
      method: "A missing subject must come from a step that could omit them entirely, which a summarise over observed records can and a left join cannot."
      numbers: "416 - 406 = 10 subjects, x 4 chemistry parameters = 40 absent rows."
      assumptions: "The specification requires a row per population subject and parameter, which is what makes 2,912 the right count."
      interpretation: "Two defects with opposite visibility; the silent one is the one that reaches the report."
      changes: "Building the grid from ADSL and asserting the row count makes the loss impossible."
      interviewer: "That you identify which of the two defects is dangerous and say why the warning-free one is worse."

  - id: r.fun.derivation-diff
    format: diff
    modes: [qc, debug]
    difficulty: advanced
    skills: [r.functions, qc.compare, adam.bds]
    lesson: r-functions-and-reproducible-code
    title: Two derivations of the same worst grade
    minutes: 12
    prompt: |
      Production and QC each derived a worst post-baseline laboratory grade per subject and parameter for
      CBX417-301. Both programs ran without error. Their summaries differ.

      ADSL has 416 subjects with `SAFFL == "Y"`; ADLB has 7 parameters.

      What explains the difference?
    codeLanguage: r
    leftCode: |
      worst <- adlb |>
        filter(ONTRTFL == "Y") |>
        summarise(WTOXGR = max(ATOXGR, na.rm = TRUE),
                  .by = c(USUBJID, PARAMCD))
    rightCode: |
      pop_ids <- adsl$USUBJID[adsl$SAFFL == "Y"]
      params  <- sort(unique(adlb$PARAMCD))

      obs <- adlb |>
        filter(ONTRTFL == "Y", USUBJID %in% pop_ids) |>
        summarise(n_grd  = sum(!is.na(ATOXGR)),
                  WTOXGR = if (any(!is.na(ATOXGR))) max(ATOXGR, na.rm = TRUE)
                           else NA_integer_,
                  .by = c(USUBJID, PARAMCD))

      worst <- expand.grid(USUBJID = pop_ids, PARAMCD = params,
                           stringsAsFactors = FALSE) |>
        left_join(obs, by = c("USUBJID", "PARAMCD"))
    left:
      title: "Production — rows per parameter"
      columns: ["PARAMCD", "Rows", "WTOXGR = -Inf", "Graded"]
      rows:
        - ["ALT", 406, 0, 406]
        - ["AST", 406, 0, 406]
        - ["BILI", 406, 0, 406]
        - ["CREAT", 406, 406, 0]
        - ["HGB", 416, 0, 416]
        - ["NEUT", 416, 0, 416]
        - ["PLAT", 416, 0, 416]
        - ["Total", 2872, 406, 2466]
      footnote: "Ran with a warning: 406 warnings in summarise(), no non-missing arguments to max."
    right:
      title: "QC — rows per parameter"
      columns: ["PARAMCD", "Rows", "WTOXGR = NA", "Graded"]
      rows:
        - ["ALT", 416, 10, 406]
        - ["AST", 416, 10, 406]
        - ["BILI", 416, 10, 406]
        - ["CREAT", 416, 416, 0]
        - ["HGB", 416, 0, 416]
        - ["NEUT", 416, 0, 416]
        - ["PLAT", 416, 0, 416]
        - ["Total", 2912, 446, 2466]
      footnote: "Ran clean."
    choices:
      - text: "Production started from ADLB, so subjects with no post-baseline chemistry never formed a group — 10 subjects × 4 chemistry parameters = 40 absent rows. QC built the frame from the ADSL safety population first."
        correct: true
        feedback: "Correct. That is the 2,912 versus 2,872 difference, and it makes the chemistry denominator 406 rather than 416."
      - text: "Production's `max(ATOXGR, na.rm = TRUE)` returned `-Inf` for the 406 creatinine groups where no grade exists; QC's guard returns `NA_integer_` instead."
        correct: true
        feedback: "Correct, and this is the second, independent difference — the one that warned. -Inf is numeric, passes is.na(), and sorts below grade 0."
      - text: "The two programs used different on-treatment flags."
        feedback: "Both filter on `ONTRTFL == \"Y\"`. The graded counts are identical in every row, which is what you would not see if the record selection differed."
      - text: "QC included subjects who were randomized but never treated."
        feedback: "QC used SAFFL == 'Y', which is the treated population — 416 of the 420 randomized. The extra rows are population subjects with no records, not extra subjects."
      - text: "Rounding or a quartile-definition difference between the two implementations."
        feedback: "Neither program computes a quantile or rounds anything. The counts differ, not a statistic."
    solution: |
      **Two independent differences, and the "Graded" column proves it.**

      Graded counts are **identical in every row** — 406, 406, 406, 0, 416, 416, 416, totalling 2,466. The
      two programs agree completely about which records are gradeable and what the grades are. Everything
      that differs is about rows that have **no** gradeable record.

      **Difference 1 — where the population came from.** Production summarised the observed records, so it
      could only produce a row for a subject–parameter combination that had at least one record. Ten
      subjects have no post-baseline chemistry at all:

      $$10 \text{ subjects} \times 4 \text{ chemistry parameters} = 40 \text{ absent rows}$$

      $$2{,}912 - 2{,}872 = 40$$

      The consequence is a chemistry denominator of 406 rather than 416 — a relative overstatement of
      about 2.5% in every chemistry percentage, with nothing in the output to reveal it. **This difference
      is silent.**

      **Difference 2 — what an ungradeable group produces.** `max(c(NA, NA), na.rm = TRUE)` is `-Inf`, not
      `NA`. 406 creatinine groups hit it. `-Inf` is numeric: it fails `is.na()`, sorts below grade 0, and
      satisfies any `<= 0` comparison. **This difference warns**, 406 times.

      **Neither program is obviously wrong, which is the point.** The specification did not say whether
      subjects with no records for a parameter should appear as rows, and it did not say what an
      ungradeable parameter should produce. Both are findings against the SAP, and both go to the study
      statistician rather than to a programmer.

      **The reconciliation route:** notice that the difference has a *shape* — ten subjects, four
      parameters, one whole panel. A difference that forms a rectangle is a specification disagreement. A
      difference scattered randomly across subjects is usually arithmetic.
    explanation:
      objective: "Reconcile two independent derivations that disagree on row counts but not on values."
      given: "Two per-parameter summaries with identical graded counts and different totals."
      relevant: "That the graded counts match exactly, so the record selection and the grading agree."
      irrelevant: "Rounding and quantile conventions, since nothing here is rounded or quantiled."
      method: "Isolate what differs (rows with no gradeable record) from what does not (everything gradeable)."
      numbers: "2,912 versus 2,872 rows, a difference of 40 = 10 subjects x 4 chemistry parameters; 446 NA versus 406 -Inf."
      assumptions: "Both programs used the same ADLB extract and the same ONTRTFL flag, which the identical graded counts support."
      interpretation: "Two specification gaps, not two bugs; one warns and one is silent."
      changes: "If the SAP stated the output grain and the ungradeable-parameter rule, neither difference could arise."
      interviewer: "That you use the matching column to narrow the search before proposing a cause."

  - id: r.fun.open
    format: open
    modes: [interview]
    difficulty: advanced
    skills: [r.functions, repro.project-structure, repro.testing, communication.interviewing]
    lesson: r-functions-and-reproducible-code
    title: Making an analysis reproducible
    prompt: |
      **Interviewer:** "You're inheriting an R analysis from someone who has left. What would you need
      before you'd be willing to say it's reproducible?"
    modelAnswer: |
      I'd want to separate three claims that get bundled together, because they need different evidence.

      **Rerunnable.** Can I run it again and get the same numbers? That needs no manual steps — nothing
      that was fixed up by hand in a spreadsheet, nothing that depends on objects left in a workspace from
      a previous session. I'd delete the output directory and rebuild it from the programs; if anything is
      missing afterwards, it was made by hand and the study is not reproducible. I'd also check that the
      scripts don't depend on a saved `.RData` or on the working directory happening to be right, and that
      any stochastic step sets a seed.

      **Portable.** Does someone else get the same numbers? That is mostly package versions. A seed is not
      enough on its own — R 3.6.0 changed the default algorithm `sample()` uses, so the same seed under a
      different `RNGkind()` gives a different answer. On the study I've been working with, that moved a
      bootstrap confidence interval by half a millimetre of mercury with everything else identical. So I'd
      want a lockfile — `renv.lock` or an equivalent frozen library — and `sessionInfo()` written into
      every log, which is the weaker but always-available record of what actually ran. `sessionInfo()`
      lists loaded namespaces as well as attached packages, and that matters: `dplyr` does its evaluation
      through `rlang` and its selection through `tidyselect`, and either can change behaviour without
      `dplyr`'s own version moving.

      **Re-derivable.** This is the one that actually matters and the one people skip. Can someone who has
      never read this code produce the same numbers from the specification? That is what double
      programming tests, and it is the only check on whether the *specification* was understood. A program
      can be perfectly rerunnable and portable and still compute the wrong thing, correctly, every time.

      Beyond that I'd want the code itself to say what it assumed. Assertions in the derivation
      functions — row counts, one row per key, the set of levels in a categorical, no impossible values.
      Not in a separate test suite that someone has to remember to run, but inside the function, so they
      execute on every run including the one at eleven at night before a delivery. When two
      implementations disagree, an assertion turns "our numbers differ" into "this program expected 2,912
      rows and produced 2,872, and here is the line that says why."

      And I'd want to know where the boundary of the analysis is. Which inputs are read-only, which
      outputs are generated, what the data cut-off was, what the source extract was. An analysis that
      cannot say what it read is not reproducible regardless of how clean the code is.

      One practical thing I'd do first: run it. A surprising amount of inherited code does not run at all
      on a clean machine, and that tells you more in twenty minutes than reading it for two days.
    rubric:
      - Distinguishes rerunnable, portable and re-derivable as separate claims
      - Tests rerunnability by deleting and rebuilding the output directory
      - Names package versions and a lockfile, not only a seed
      - Knows a seed is insufficient across R versions (the sample() algorithm change)
      - Mentions sessionInfo() and why loaded namespaces matter
      - Frames independent re-derivation as the test of the specification, not of the code
      - Wants assertions inside production functions rather than in a separate suite
      - Asks what the inputs, data cut-off and source extract were
    redFlags:
      - "Equates reproducibility with setting a seed"
      - "Treats a passing test suite as sufficient"
      - "Does not distinguish a coding error from a specification misreading"
      - "Would write the QC program by reading the production program"
      - "Ignores package versions entirely"
