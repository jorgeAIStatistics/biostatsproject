<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clinical Biometrics Mastery OS — an interactive training environment for clinical statistical programming, biostatistics, CDISC, and applied pharma analytics (synthetic data, educational use)." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Clinical Biometrics Mastery OS</title>
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('cbmos:settings');
          var theme = raw ? JSON.parse(raw).state.theme : 'system';
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
